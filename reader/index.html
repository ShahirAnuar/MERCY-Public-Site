<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071f48">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="The Guide">
  <link rel="manifest" href="/reader/manifest.webmanifest">
  <title>The Guide · Full-screen Reader</title>
  <meta name="description" content="Read The Guide one full-screen page at a time. Scroll or swipe to turn pages.">
  <style>
    :root{color-scheme:dark;--navy:#071f48;--gold:#e8c46a;--cream:#fff6df}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020b1d;color:var(--cream);font:16px/1.4 system-ui,sans-serif}
    button,label,a{touch-action:manipulation}button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:3px}
    .reader{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overscroll-behavior:none}
    .reader.reading{display:block}.reader.reading #stage{height:100dvh;width:100vw}.reader.reading header,.reader.reading .toolbar{position:absolute;left:0;right:0;transition:opacity .22s ease;z-index:3}.reader.reading header{top:0}.reader.reading .toolbar{bottom:0}.reader.reading:not(.controls-visible) header,.reader.reading:not(.controls-visible) .toolbar{opacity:0;pointer-events:none}
    header,.toolbar{background:rgba(4,20,46,.94);display:flex;align-items:center;gap:.65rem;padding:.55rem max(.65rem,env(safe-area-inset-left));min-height:54px;z-index:2}
    header{border-bottom:1px solid #b7944b66}.toolbar{border-top:1px solid #b7944b66;justify-content:center;padding-bottom:max(.6rem,env(safe-area-inset-bottom))}
    .brand{font:700 1.18rem Georgia,serif;letter-spacing:.12em;color:var(--gold);white-space:nowrap}.spacer{flex:1}a{color:var(--cream)}
    button,.file-button{border:1px solid #b7944b;border-radius:999px;background:var(--navy);color:var(--cream);padding:.56rem .8rem;min-width:44px;min-height:44px;font:700 .92rem system-ui;cursor:pointer;text-align:center}
    button:disabled{opacity:.4;cursor:default}.file-button input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    #stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;touch-action:none;background:radial-gradient(circle,#173054,#020b1d 70%)}
    #page-shell{position:relative;max-width:100%;max-height:100%;box-shadow:0 12px 40px #000b;line-height:0}
    canvas{display:block;max-width:100%;max-height:100%;height:auto;width:auto}
    #links{position:absolute;inset:0}.pdf-link{position:absolute;display:block;border-radius:5px;min-width:20px;min-height:20px}.pdf-link:focus-visible{outline:3px solid #f4c849;background:#f4c84944}
    .thread-target{position:absolute;display:block;border:0;background:transparent;border-radius:5px;min-width:28px;min-height:28px;padding:0;cursor:pointer}.thread-target:focus-visible{outline:3px solid #f4c849;background:#f4c84944}
    #thread-dialog{width:min(680px,calc(100vw - 1rem));max-height:calc(100dvh - 1rem);border:2px solid #d5a63d;border-radius:20px;background:#fff9e9;color:#17243a;padding:0;box-shadow:0 22px 70px #000a}
    #thread-dialog::backdrop{background:#020b1dcc;backdrop-filter:blur(4px)}.thread-card{padding:clamp(1.1rem,4vw,2rem);max-height:calc(100dvh - 1rem);overflow:auto;line-height:1.55}.thread-card h2{font:700 clamp(1.5rem,5vw,2rem) Georgia,serif;color:#071f48;margin:.35rem 2.8rem .8rem 0}.thread-card p{white-space:pre-wrap}.thread-close{float:right;background:#071f48;color:white}.thread-verse{background:#fff0c2;border-left:4px solid #b58c30;padding:.8rem 1rem}.lens-buttons{display:flex;flex-wrap:wrap;gap:.45rem;margin:.8rem 0}.lens-buttons button{background:#fff;color:#071f48;border-color:#a98234}.lens-buttons button[aria-pressed=true]{background:#071f48;color:#fff}.lens-panel{background:#f4ebd5;border-radius:12px;padding:1rem;min-height:3rem}.lens-access{display:grid;gap:.5rem;margin-top:1.2rem;border-top:1px solid #d1ba83;padding-top:1.2rem}.lens-access input{font:inherit;padding:.75rem;border:1px solid #a98234;border-radius:8px;min-width:0}.lens-access button{justify-self:start}.lens-access p{margin:.25rem 0;font-size:.9rem}
    #empty{padding:1.5rem;max-width:30rem;text-align:center;line-height:1.6}#empty h1{font:700 clamp(1.8rem,7vw,2.8rem) Georgia,serif;color:var(--gold);margin:.2rem 0}.empty-cover{display:block;width:min(42vw,170px);height:auto;max-height:32dvh;object-fit:contain;margin:0 auto 1rem;border:2px solid #c49b44;border-radius:.35rem}
    #status{font-size:.82rem;flex:1;min-width:0;text-align:center;max-width:23rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#page-count{font-variant-numeric:tabular-nums;min-width:5rem;text-align:center}
    [hidden]{display:none!important}
    @media(max-width:580px){header{gap:.35rem}.brand{font-size:1rem}header a{font-size:.83rem}.file-button{padding:.55rem}.toolbar{gap:.4rem}.toolbar button{padding:.45rem}.optional{display:none}.toolbar #status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}}
  </style>
</head>
<body>
  <div class="reader">
    <header><span class="brand">THE GUIDE</span><a href="/buy/" class="optional">Editions</a><span class="spacer"></span><button id="install" type="button">Install app</button><label class="file-button">Open PDF<input id="file" type="file" accept="application/pdf,.pdf"></label><button id="full" type="button" aria-label="Enter full screen">Expand</button></header>
    <main id="stage" aria-label="Book page">
      <div id="empty"><img class="empty-cover" src="/buy/the-guide-cover.jpg" alt="The Guide cover"><h1>One full-screen page at a time</h1><p>Open your PDF. Scroll or swipe up and down to turn pages. Tap a page to reveal controls. The PDF stays on your device.</p></div>
      <div id="page-shell" hidden><canvas id="page" aria-label="Current book page"></canvas><div id="links"></div></div>
    </main>
    <div class="toolbar"><button id="prev" type="button" aria-label="Previous page" disabled>‹ Previous</button><span id="page-count">—</span><button id="next" type="button" aria-label="Next page" disabled>Next ›</button><span id="status" role="status" aria-live="polite">Choose a PDF to begin</span></div>
  </div>
  <dialog id="thread-dialog" aria-labelledby="thread-title"><div class="thread-card"><button class="thread-close" type="button" aria-label="Close discussion thread">×</button><p id="thread-kicker">Story thread</p><h2 id="thread-title"></h2><p id="thread-note"></p><p class="thread-verse" id="thread-verse"></p><section class="lens-explorer"><h3>Explore through six lenses</h3><div class="lens-buttons"></div><p class="lens-panel" hidden></p></section></div></dialog>
  <script type="module">
    const stage=document.querySelector('#stage'),fileInput=document.querySelector('#file'),canvas=document.querySelector('#page'),shell=document.querySelector('#page-shell'),links=document.querySelector('#links'),empty=document.querySelector('#empty'),installButton=document.querySelector('#install');
    const prev=document.querySelector('#prev'),next=document.querySelector('#next'),count=document.querySelector('#page-count'),status=document.querySelector('#status');
    const dialog=document.querySelector('#thread-dialog'),lensButtons=dialog.querySelector('.lens-buttons'),lensPanel=dialog.querySelector('.lens-panel');
    let pdf=null,pageNumber=1,renderTask=null,busy=false,pendingPage=null,readerLib=null,returnFocus=null,wheelLocked=false,wheelTimer=null,wheelDistance=0,installPrompt=null;
    const lensNames=['Science','History','Psychology','Ethics','Faith','Art'];
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/reader/service-worker.js').catch(()=>{});
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;installButton.hidden=false});
    window.addEventListener('appinstalled',()=>{installPrompt=null;installButton.textContent='Installed';installButton.disabled=true;status.textContent='The Guide reader is installed.'});
    installButton.addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();const choice=await installPrompt.userChoice;if(choice.outcome==='accepted'){installButton.textContent='Installing…';installButton.disabled=true}return}const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);status.textContent=isiOS?'On iPhone or iPad: tap Share, then Add to Home Screen.':'Open your browser menu and choose Install app or Add to Home screen.';alert(status.textContent)});

    function openThread(number,title,note,verse,examples,trigger){returnFocus=trigger;dialog.querySelector('#thread-kicker').textContent='STORY THREAD '+String(number).padStart(2,'0');dialog.querySelector('#thread-title').textContent=title;dialog.querySelector('#thread-note').textContent=note;dialog.querySelector('#thread-verse').textContent='Qur’an '+verse;lensButtons.replaceChildren();lensPanel.hidden=true;lensPanel.textContent='';for(const name of lensNames){const button=document.createElement('button');button.type='button';button.textContent=name;button.dataset.lens=name.toLowerCase();button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>{[...lensButtons.children].forEach(item=>item.setAttribute('aria-pressed',String(item===button)));lensPanel.textContent=examples[name.toLowerCase()]||'This example is available in the updated edition of the PDF.';lensPanel.hidden=false});lensButtons.append(button)}dialog.showModal();dialog.querySelector('.thread-close').focus()}
    dialog.querySelector('.thread-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>returnFocus?.focus());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
    async function library(){if(readerLib)return readerLib;readerLib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');readerLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';return readerLib}
    async function showPage(number){if(!pdf||number<1||number>pdf.numPages)return;if(busy){pendingPage=number;status.textContent='Turning to page '+number+'…';return}busy=true;pendingPage=null;stage.setAttribute('aria-busy','true');status.textContent='Opening page '+number+'…';try{
      if(renderTask){renderTask.cancel();try{await renderTask.promise}catch{}renderTask=null}
      const page=await pdf.getPage(number),raw=page.getViewport({scale:1});
      const width=stage.clientWidth-8,height=stage.clientHeight-8,scale=Math.min(width/raw.width,height/raw.height);
      const viewport=page.getViewport({scale}),pixelRatio=Math.min(devicePixelRatio||1,2);
      canvas.width=Math.round(viewport.width*pixelRatio);canvas.height=Math.round(viewport.height*pixelRatio);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';shell.style.width=viewport.width+'px';shell.style.height=viewport.height+'px';links.style.width=viewport.width+'px';links.style.height=viewport.height+'px';
      links.replaceChildren();renderTask=page.render({canvasContext:canvas.getContext('2d'),viewport,transform:[pixelRatio,0,0,pixelRatio,0,0]});await renderTask.promise;renderTask=null;
      for(const annotation of await page.getAnnotations()){
        const contents=annotation.contentsObj?.str||annotation.contents||'';
        const embedded=annotation.subtype==='Text'&&/^STORY THREAD (\d+)/.exec(contents);
        let oldLink=null;
        if(annotation.subtype==='Link'&&annotation.url){const url=new URL(annotation.url);if(!['mercyseries.com','www.mercyseries.com'].includes(url.hostname))continue;oldLink=/^\/learn\/chapter-[123]\/$/.test(url.pathname)?Number(url.searchParams.get('thread')):null;if(!oldLink)continue}
        if(!embedded&&!oldLink)continue;
        const number=embedded?Number(embedded[1]):oldLink,lines=embedded?contents.split('\n'):[],title=embedded?lines[1]:'Story thread '+number,note=embedded?lines[3]:'Open this thread for the discussion.',verse=embedded?(contents.match(/Qur’an ([0-9:]+)/)||[])[1]:'—',examples={};for(const match of contents.matchAll(/(?:^|\n)(Science|History|Psychology|Ethics|Faith|Art): ([^\n]+)/g))examples[match[1].toLowerCase()]=match[2];
        const rect=viewport.convertToViewportRectangle(annotation.rect),target=document.createElement('button');target.type='button';target.className='thread-target';target.style.left=Math.min(rect[0],rect[2])+'px';target.style.top=Math.min(rect[1],rect[3])+'px';target.style.width=Math.abs(rect[2]-rect[0])+'px';target.style.height=Math.abs(rect[3]-rect[1])+'px';target.setAttribute('aria-label','Open story thread '+number+' in this reader');target.addEventListener('click',()=>openThread(number,title,note,verse,examples,target));links.append(target)
      }
      pageNumber=number;count.textContent=number+' / '+pdf.numPages;status.textContent='Scroll or swipe to turn pages';shell.hidden=false;empty.hidden=true;document.querySelector('.reader').classList.add('reading');
    }catch(error){status.textContent='Could not render this page: '+error.message}finally{busy=false;stage.removeAttribute('aria-busy');prev.disabled=!pdf||pageNumber<=1;next.disabled=!pdf||pageNumber>=pdf.numPages;const queued=pendingPage;pendingPage=null;if(queued&&queued!==pageNumber)showPage(queued)}}
    fileInput.addEventListener('change',async()=>{const file=fileInput.files?.[0];if(!file)return;status.textContent='Opening '+file.name+'…';try{const lib=await library();const bytes=new Uint8Array(await file.arrayBuffer());pdf=await lib.getDocument({data:bytes}).promise;pageNumber=1;await showPage(1)}catch(error){status.textContent='Could not open this PDF: '+error.message}});
    function turnPage(delta){if(!pdf)return;const base=pendingPage??pageNumber;showPage(Math.max(1,Math.min(pdf.numPages,base+delta)))}
    prev.addEventListener('click',event=>{event.preventDefault();turnPage(-1)});next.addEventListener('click',event=>{event.preventDefault();turnPage(1)});
    document.querySelector('#full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{status.textContent='Full screen is unavailable in this browser.'}});
    stage.addEventListener('click',event=>{if(event.target.closest('.thread-target'))return;document.querySelector('.reader').classList.toggle('controls-visible')});
    let start=null;stage.addEventListener('touchstart',event=>{if(event.touches.length===1)start=[event.touches[0].clientX,event.touches[0].clientY]},{passive:true});stage.addEventListener('touchend',event=>{if(!start||!pdf||event.target.closest('.thread-target'))return;const dx=event.changedTouches[0].clientX-start[0],dy=event.changedTouches[0].clientY-start[1];start=null;if(Math.abs(dy)>45&&Math.abs(dy)>Math.abs(dx)*1.1)turnPage(dy<0?1:-1);else if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)turnPage(dx<0?1:-1)},{passive:true});
    stage.addEventListener('wheel',event=>{if(!pdf||dialog.open)return;event.preventDefault();clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelLocked=false;wheelDistance=0},180);if(wheelLocked||busy)return;wheelDistance+=event.deltaY;if(Math.abs(wheelDistance)>28){wheelLocked=true;turnPage(wheelDistance>0?1:-1)}},{passive:false});
    window.addEventListener('keydown',event=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)){event.preventDefault();turnPage(1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();turnPage(-1)}});
    let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(pdf)showPage(pageNumber)},150)});
  </script>
</body>
</html>
