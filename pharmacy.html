<div id="toast" role="status" aria-live="polite"></div>
</main>
<script>
(()=>{
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function makeState(){return{x:0,zoom:1,panStep:7,zoomStep:.008,maxPan:105,minZoom:.94,maxZoom:1.18}}
function step(s,d){const n={...s};if(d==='left')n.x=clamp(n.x+n.panStep,-n.maxPan,n.maxPan);else if(d==='right')n.x=clamp(n.x-n.panStep,-n.maxPan,n.maxPan);else if(d==='forward')n.zoom=clamp(Number((n.zoom+n.zoomStep).toFixed(4)),n.minZoom,n.maxZoom);else if(d==='back')n.zoom=clamp(Number((n.zoom-n.zoomStep).toFixed(4)),n.minZoom,n.maxZoom);return n}
function direction(dx,dy,dz){if(Math.hypot(dx,dy)<dz)return null;if(Math.abs(dx)>Math.abs(dy))return dx>0?'right':'left';return dy<0?'forward':'back'}
const world=document.getElementById('world'),joy=document.getElementById('joystick'),ok=document.getElementById('ok'),toast=document.getElementById('toast');let state=makeState(),active=null,last=0;
function render(){world.style.transform=`translate(calc(-50% + ${state.x}px),-50%) scale(${state.zoom})`}
function move(d){if(!d)return;state=step(state,d);render()}
function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1600)}
function keydir(k){k=String(k||'').toLowerCase();if(k==='w'||k==='arrowup')return'forward';if(k==='s'||k==='arrowdown')return'back';if(k==='a'||k==='arrowleft')return'left';if(k==='d'||k==='arrowright')return'right';return null}
addEventListener('keydown',e=>{const d=keydir(e.key);if(d){e.preventDefault();active=d}if(e.key==='Enter'||e.key.toLowerCase()==='e'){e.preventDefault();say('OK — pharmacist interaction will connect here next.')}},{passive:false});
addEventListener('keyup',e=>{if(keydir(e.key)===active)active=null});
function pd(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);return direction(dx,dy,Math.max(8,r.width*.1))}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joy.setPointerCapture(e.pointerId);active=pd(e)});
joy.addEventListener('pointermove',e=>{if(!joy.hasPointerCapture(e.pointerId))return;e.preventDefault();active=pd(e)});
function end(e){if(joy.hasPointerCapture(e.pointerId))joy.releasePointerCapture(e.pointerId);active=null}
joy.addEventListener('pointerup',end);joy.addEventListener('pointercancel',end);
ok.addEventListener('pointerdown',e=>{e.preventDefault();say('OK — pharmacist interaction will connect here next.')});
function loop(ts){if(active&&ts-last>36){move(active);last=ts}requestAnimationFrame(loop)}
render();requestAnimationFrame(loop);
})();
</script>
