name: MERCY affiliate coupon service tests
on:
  pull_request:
    paths:
      - 'affiliate-service/**'
      - '.github/workflows/affiliate-coupon-tests.yml'
  push:
    branches: [main]
    paths:
      - 'affiliate-service/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: affiliate-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test coupon creation, ownership and idempotency
        run: npm test
